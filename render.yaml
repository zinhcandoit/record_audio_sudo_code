services:
  - type: web
    name: nu-thu-am-telesale
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME_SCRIPTS
        value: telesale_scripts_db
      - key: DB_NAME_RECORDINGS
        value: telesale_recordings_db
      - key: RAPIDFUZZ_SCORE_THRESHOLD
        value: "0.85"
      - key: WPM_MIN_THRESHOLD
        value: "4.0"

